services:
  web:
    build: ./docker/php
    container_name: utu_web_local
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=sistema_torneos
      - DB_USER=root
      - DB_PASSWORD=
    depends_on:
      - db

  db:
    image: mariadb:10.6
    container_name: utu_db_local
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: sgdm_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./base_de_datos/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data:
